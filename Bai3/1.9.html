<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giới thiệu bản thân</title>
</head>

<body>


        <div id="content" style="margin: 50px;">
            <script type="text/javascript">
                var x;
                var mycars = new Array();
                mycars[0] = "Saab";
                mycars[1] = "Volvo";
                mycars[2] = "BMW";
                for (x in mycars) {
                    document.write(mycars[x] + "<br />");
                }

            </script>
        </div>

</body>

</html>
