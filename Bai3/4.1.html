<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giới thiệu bản thân</title>
    <link rel="stylesheet" href="css/4.1.css">
</head>

<body>

    <div id="content" style="margin-left: 300px;">
        <h2>Nhập thông tin hồ sơ học sinh</h2><br>
        <form id="hosoForm" onsubmit="return validateHoso()">
            <label for="mahs">Mã học sinh (8 ký tự):</label><br>
            <input type="text" id="mahs" name="mahs" maxlength="8" required><br><br>

            <label for="hoten">Họ và tên (tối đa 50 ký tự):</label><br>
            <input type="text" id="hoten" name="hoten" maxlength="50" required><br><br>

            <label for="ngaysinh">Ngày sinh:</label><br>
            <input type="date" id="ngaysinh" name="ngaysinh" required><br><br>

            <label for="diachi">Địa chỉ (tối đa 150 ký tự):</label><br>
            <input type="text" id="diachi" name="diachi" maxlength="150" required><br><br>

            <label for="lop">Lớp (6 ký tự):</label><br>
            <input type="text" id="lop" name="lop" maxlength="6" required><br><br>

            <label for="diemtoan">Điểm Toán (0 - 10):</label><br>
            <input type="text" id="diemtoan" name="diemtoan" required><br><br>

            <label for="diemly">Điểm Lý (0 - 10):</label><br>
            <input type="text" id="diemly" name="diemly" required><br><br>

            <label for="diemhoa">Điểm Hóa (0 - 10):</label><br>
            <input type="text" id="diemhoa" name="diemhoa" required><br><br>

            <button type="submit">Lưu</button>
        </form>

        <script>
            function validateHoso() {
                const mahs = document.getElementById("mahs").value.trim();
                const hoten = document.getElementById("hoten").value.trim();
                const ngaysinh = document.getElementById("ngaysinh").value;
                const diachi = document.getElementById("diachi").value.trim();
                const lop = document.getElementById("lop").value.trim();
                const diemtoan = parseFloat(document.getElementById("diemtoan").value);
                const diemly = parseFloat(document.getElementById("diemly").value);
                const diemhoa = parseFloat(document.getElementById("diemhoa").value);

                // Kiểm tra MAHS
                if (mahs.length !== 8) {
                    alert("Mã học sinh phải đủ 8 ký tự!");
                    return false;
                }

                // Kiểm tra HOTEN
                if (hoten === "" || hoten.length > 50) {
                    alert("Họ tên không được rỗng và tối đa 50 ký tự!");
                    return false;
                }

                // Kiểm tra NGAYSINH
                if (ngaysinh === "" || new Date(ngaysinh) > new Date()) {
                    alert("Ngày sinh không hợp lệ!");
                    return false;
                }

                // Kiểm tra DIACHI
                if (diachi === "" || diachi.length > 150) {
                    alert("Địa chỉ không được rỗng và tối đa 150 ký tự!");
                    return false;
                }

                // Kiểm tra LOP
                if (lop.length !== 6) {
                    alert("Lớp phải đủ 6 ký tự!");
                    return false;
                }

                // Kiểm tra điểm số (Toán, Lý, Hóa)
                function function checkDiem(value, mon) {
                    if (isNaN(value) || value < 0 || value > 10) {
                        alert("Điểm " + mon + " phải từ 0 đến 10!");
                        return false;
                    }
                    return true;
                }
                if (!checkDiem(diemtoan, "Toán")) return false;
                if (!checkDiem(diemly, "Lý")) return false;
                if (!checkDiem(diemhoa, "Hóa")) return false;

                alert("Dữ liệu hợp lệ, form sẽ được gửi!");
                return true;
            }
        </script>
    </div>
</body>

</html>
